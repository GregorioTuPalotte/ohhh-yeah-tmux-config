
# ==========================================
# GENERAL SETTINGS
# ==========================================

set -g default-terminal "tmux-256color"
set -g history-limit 20000
set -g buffer-limit 20
set -sg escape-time 0
set -g display-time 1500
setw -g remain-on-exit off
set -s repeat-time 300

setw -g allow-rename off
setw -g automatic-rename off
setw -g aggressive-resize on

# Prefix
unbind C-b
set -g prefix C-a

# Terminal title
set -g set-titles on
set -g set-titles-string "#I:#W"

# Start indexing at 1
set -g base-index 1
setw -g pane-base-index 1

# Mouse
set -g mouse on


# ==========================================
# KEY BINDINGS
# ==========================================

# Unbind defaults
unbind '$'
unbind ','
unbind '%'
unbind '"'
unbind '}'
unbind '{'
unbind '['
unbind ']'
unbind "'"
unbind n
unbind p
unbind l
unbind M-n
unbind M-p
unbind o
unbind '&'
unbind '#'
unbind =
unbind z
unbind M-Up
unbind M-Down
unbind M-Right
unbind M-Left

# Edit configuration
bind C-e new-window -n 'tmux.conf' \
    "sh -c '\${EDITOR:-vim} ~/.tmux.conf && tmux source-file ~/.tmux.conf && tmux display-message \"Config reloaded\"'"

# Reload configuration
bind C-r source-file ~/.tmux.conf \; display-message "Config reloaded"

# New window, retaining current directory
bind c new-window -c "#{pane_current_path}"

# Rename windows and sessions
bind r command-prompt -I "#{window_name}" "rename-window '%%'"
bind R command-prompt -I "#{session_name}" "rename-session '%%'"

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# Navigate windows
bind -r C-[ previous-window
bind -r C-] next-window
bind -r Tab last-window

# Navigate panes
bind -r [ select-pane -t :.-
bind -r ] select-pane -t :.+
bind -r C-o swap-pane -D

# Zoom pane
bind + resize-pane -Z

# Link windows
bind L command-prompt -p "Link window from (session:window): " \
    "link-window -s %% -a"

# Kill panes/windows/sessions
bind x kill-pane
bind X kill-window
bind C-x confirm-before -p "kill other windows? (y/n)" "kill-window -a"
bind Q confirm-before -p "kill-session #S? (y/n)" kill-session

# Merge sessions
bind C-u command-prompt -p "Session to merge with: " \
    "run-shell 'yes | head -n #{session_windows} | xargs -I {} -n 1 tmux movew -t %%'"

# Detach
bind d detach

bind D if -F '#{session_many_attached}' \
    'confirm-before -p "Detach other clients? (y/n)" "detach -a"' \
    'display-message "Session has only 1 client attached"'

# Toggle status bar
bind C-s set-option -g status

# ==========================================
# WINDOW MONITORING
# ==========================================

bind m setw monitor-activity

# Set silence monitoring interval (0 disables it)
bind M command-prompt -p "Monitor silence interval (0 = off):" \
    "setw monitor-silence %%"

set -g visual-activity on


# ==========================================
# COPY MODE AND CLIPBOARD
# ==========================================

setw -g mode-keys vi

bind p paste-buffer
bind C-p choose-buffer

# Enter copy mode
bind -n M-Up copy-mode

# Scrolling
bind -T copy-mode-vi M-Up send-keys -X scroll-up
bind -T copy-mode-vi M-Down send-keys -X scroll-down
bind -T copy-mode-vi M-PageUp send-keys -X halfpage-up
bind -T copy-mode-vi M-PageDown send-keys -X halfpage-down
bind -T copy-mode-vi PageDown send-keys -X page-down
bind -T copy-mode-vi PageUp send-keys -X page-up

# Mouse scrolling
bind -T copy-mode-vi WheelUpPane \
    select-pane \; send-keys -X -N 2 scroll-up

bind -T copy-mode-vi WheelDownPane \
    select-pane \; send-keys -X -N 2 scroll-down

# Copy selected text
bind -T copy-mode-vi Enter \
    send-keys -X copy-pipe-and-cancel "$HOME/.tmux/yank.sh"

bind -T copy-mode-vi y \
    send-keys -X copy-pipe-and-cancel "$HOME/.tmux/yank.sh"

# Copy entire line
bind -T copy-mode-vi Y \
    send-keys -X copy-line \; \
    run-shell "tmux save-buffer - | $HOME/.tmux/yank.sh"

# Copy to end of line
bind -T copy-mode-vi D \
    send-keys -X copy-end-of-line \; \
    run-shell "tmux save-buffer - | $HOME/.tmux/yank.sh"

# Alternative copy
bind -T copy-mode-vi C-j \
    send-keys -X copy-pipe-and-cancel "$HOME/.tmux/yank.sh"

# Append selection
bind -T copy-mode-vi A \
    send-keys -X append-selection-and-cancel \; \
    run-shell "tmux save-buffer - | $HOME/.tmux/yank.sh"

# Mouse selection
bind -T copy-mode-vi MouseDragEnd1Pane \
    send-keys -X copy-pipe "$HOME/.tmux/yank.sh"

bind -T copy-mode-vi MouseDown1Pane \
    select-pane \; send-keys -X clear-selection


# ==========================================
# THEME
# ==========================================

# Colors
# Orange: 166
# Purple: 134
# Green: 076
# Blue: 39
# Yellow: 220
# Red: 160
# Black: 232
# White: 015

set -g mode-style "fg=default,bg=colour166"

# Command messages
set -g message-style "fg=colour166,bg=colour232"

# Status bar
set -g status-style "fg=colour245,bg=colour232"

# Window separators
set -g window-status-separator ""

# Window appearance
setw -g window-status-style "fg=colour245,bg=colour232"
setw -g window-status-format " #I:#W "

# Active window
setw -g window-status-current-style "fg=white,bold,bg=colour166"

setw -g window-status-current-format \
    "#[fg=colour232,bg=colour166]#[default] #I:#W# #[fg=colour166,bg=colour232]#[default]"

# Activity indicator
setw -g window-status-activity-style "fg=colour166"

# Active pane border
setw -g pane-active-border-style "fg=colour166"

# Status bar configuration
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-right-length 150

# Status left
set -g status-left "#[fg=colour39] #S #[default]"

# Status right
set -g status-right \
    "#{prefix_highlight} #{?#{==:#{key-table},off},OFF,} #{?window_zoomed_flag,[Z],} #{sysstat_cpu} | #{sysstat_mem} | #{sysstat_loadavg} | #(whoami)@#H | #[fg=colour134]%h %d %H:%M#[default] #{battery_status_fg} #{battery_icon} #{battery_percentage} #{online_status}"

# Online/offline indicators
set -g @online_icon "#[fg=colour076]●#[default]"
set -g @offline_icon "#[fg=colour160]●#[default]"

# Sysstat memory template
set -g @sysstat_mem_view_tmpl \
    'MEM:#[fg=#{mem.color}]#{mem.pused}#[default] #{mem.used}'

# Sysstat CPU colors
set -g @sysstat_cpu_color_low "colour076"
set -g @sysstat_cpu_color_medium "colour220"
set -g @sysstat_cpu_color_stress "colour160"

# Sysstat memory colors
set -g @sysstat_mem_color_low "colour076"
set -g @sysstat_mem_color_medium "colour220"
set -g @sysstat_mem_color_stress "colour160"

# Sysstat swap colors
set -g @sysstat_swap_color_low "colour076"
set -g @sysstat_swap_color_medium "colour220"
set -g @sysstat_swap_color_stress "colour160"

# Battery colors
set -g @batt_color_full_charge "#[fg=colour076]"
set -g @batt_color_high_charge "#[fg=colour076]"
set -g @batt_color_medium_charge "#[fg=colour220]"
set -g @batt_color_low_charge "#[fg=colour160]"

# Prefix highlight
set -g @prefix_highlight_output_prefix '['
set -g @prefix_highlight_output_suffix ']'
set -g @prefix_highlight_fg "colour232"
set -g @prefix_highlight_bg "colour134"
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr "fg=colour232,bg=colour134"


# ==========================================
# ENVIRONMENT
# ==========================================

set -g update-environment \
    "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION SSH_TTY WINDOWID XAUTHORITY"

bind '$' run-shell "~/.tmux/renew_env.sh"


# ==========================================
# PLUGINS
# ==========================================

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'

set -g @plugin 'samoshkin/tmux-plugin-sysstat'

# Sidebar
set -g @sidebar-tree 't'
set -g @sidebar-tree-focus 'T'
set -g @sidebar-tree-command 'tree -C'

# Open plugin
set -g @open-S 'https://www.google.com/search?q='


# ==========================================
# NESTED LOCAL / REMOTE SESSIONS
# ==========================================

# Load remote configuration when connected over SSH
if-shell 'test -n "$SSH_CLIENT"' \
    'source-file ~/.tmux/tmux.remote.conf'

# F12: Disable local keybindings
bind -T root F12 \
    set prefix None \; \
    set key-table off \; \
    set status-style "fg=colour245,bg=colour238" \; \
    setw window-status-current-format \
        "#[fg=colour238,bg=colour254]#[default] #I:#W# #[fg=colour254,bg=colour238]#[default]" \; \
    setw window-status-current-style "fg=colour232,bold,bg=colour254" \; \
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \; \
    refresh-client -S

# F12: Restore local keybindings
bind -T off F12 \
    set -u prefix \; \
    set -u key-table \; \
    set -u status-style \; \
    setw -u window-status-current-style \; \
    setw -u window-status-current-format \; \
    refresh-client -S


# ==========================================
# TPM INITIALIZATION
# ==========================================

run '~/.tmux/plugins/tpm/tpm'

